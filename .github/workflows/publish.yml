# Release pipeline: python-semantic-release reads the Conventional Commits since the last tag, bumps the version in
# pyproject.toml, writes CHANGELOG.md, tags vX.Y.Z, creates the GitHub release, and then this job publishes to PyPI with a
# Trusted Publisher (OIDC, no token). The PyPI publisher is registered for: project pulsecheckcli, owner arian24b,
# repository pulsecheck, workflow publish.yml, environment pypi.
#
# Fully automatic: every time CI passes on main, releasable commits (feat, fix, perf, breaking) make a new release.
# "Run workflow" (workflow_dispatch) can also force a bump level.
name: publish
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "Bump level (auto = decide from the commit messages)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write # push the version commit, the tag and the GitHub release
  id-token: write # PyPI trusted publishing

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pulsecheckcli/
    concurrency: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release needs the full history and tags
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      - uses: astral-sh/setup-uv@v7
      - name: Git identity for the release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Version, changelog, tag and GitHub release
        id: sr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ -n "$FORCE" ] && [ "$FORCE" != auto ]; then args+=("--$FORCE"); fi
          uvx --from "python-semantic-release>=9,<11" semantic-release version --changelog --tag --push "${args[@]}"
          # a tag points at HEAD only when this run made a release
          if git describe --exact-match --tags HEAD >/dev/null 2>&1; then echo "released=true" >> "$GITHUB_OUTPUT"; fi
      - name: Build and publish to PyPI
        if: steps.sr.outputs.released == 'true'
        run: |
          uv build
          uvx twine check dist/*
          uv publish --trusted-publishing always
