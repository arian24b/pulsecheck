name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where do you run pulsecheck?
      options: [CLI / cron, GitHub Actions, GitLab CI, Vercel, Cloudflare Worker]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant config (remove hostnames and tokens)
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Output or logs (remove tokens)
      render: text
  - type: input
    id: version
    attributes:
      label: Version or commit
