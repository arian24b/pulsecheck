# Run `pulsecheck -c pulsecheck.yml validate` to check this file.
# ${VAR} is replaced from the environment (use CI secrets for tokens).
state_file: pulsecheck.db        # keeps up/down state + history between runs
shoutrrr_bin: auto               # auto = docker image if docker works, else the shoutrrr binary;
                                 # docker = always image; or a path to a binary
shoutrrr_image: nickfedor/shoutrrr:0.21.2

notify:                          # global; a site may override with its own notify:
  urls:
    - telegram://${TG_TOKEN}@telegram?chats=${TG_CHAT}
  events: [down, up, degraded]

messages:                        # optional: edit any alert text. Keys: down, reminder, degraded, up, ssl_warn, test
  down: "🔴 {site} is DOWN: {error}"          # placeholders: {site} {event} {error} {ms} {minutes} {status} {tags} {days}
  # up: "🟢 {site} recovered after {minutes} min"   # a site can also have its own messages:

# otel:                          # optional: push results as OpenTelemetry (OTLP/HTTP JSON) to a collector or webhook
#   endpoint: https://otel-collector.example.com:4318   # /v1/metrics and /v1/logs are appended
#   headers: {Authorization: "Bearer ${OTEL_TOKEN}"}
#   resource: {env: prod}

defaults:                        # merged into every site
  timeout: 10                    # seconds
  down_after: 2                  # consecutive failures before alerting
  interval: 5                    # minutes between checks of a site
  slow_ms: 3000                  # >= this = degraded
  # remind_every: 60            # minutes between repeated "still down" alerts (0 = off)

maintenance:                     # UTC; alerts suppressed while active
  - {name: weekly, start: "SUN 02:00", duration: 60}   # minutes; add sites: [web] to scope

sites:
  - name: web
    url: https://example.com
    tags: [prod]                 # use with --tag prod
    ssl_warn_days: 14            # warn when the https certificate expires within 14 days
    # ip_version: 6              # connect only over IPv6 (or 4); default: whatever the system picks
    expected_status: [200, 301]  # default: any 2xx
    max_response_ms: 10000       # slower = down
  - name: api
    url: https://example.com/health
    method: POST
    headers: {Authorization: "Bearer ${API_TOKEN}"}
    body: '{"ping": true}'
    max_redirects: 3
  - {name: db, type: tcp, host: db.internal, port: 5432}
  - {name: gateway, type: ping, host: 10.0.0.1}
