[project]
name = "pulsecheck"
version = "0.1.0"
description = "Self-hosted uptime monitor: HTTP/TCP/ping/TLS checks, shoutrrr alerts, OpenTelemetry export. Runs from cron, CI or serverless."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["uptime", "monitoring", "shoutrrr", "alerts", "opentelemetry", "cron", "healthcheck"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.12,<3.16"
dependencies = [
    "httpx>=0.28.1",
    "ruamel-yaml>=0.19.1",
]

[project.urls]
Homepage = "https://github.com/arian24b/pulsecheck"
Documentation = "https://github.com/arian24b/pulsecheck/wiki"
Issues = "https://github.com/arian24b/pulsecheck/issues"
Changelog = "https://github.com/arian24b/pulsecheck/releases"

[project.scripts]
pulsecheck = "pulsecheck.cli:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["deploy/cloudflare/.cloudflare"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
