[project]
name = "pulsecheck"
version = "0.1.0"
description = "Self-hosted uptime monitor with shoutrrr notifications"
requires-python = ">=3.12,<3.16"
dependencies = [
    "httpx>=0.28.1",
    "ruamel-yaml>=0.19.1",
]

[project.scripts]
pulsecheck = "pulsecheck.cli:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["deploy/cloudflare/.cloudflare"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
