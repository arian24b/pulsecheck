[project]
name = "pulsecheck-worker"
version = "0.1.0"
description = "pulsecheck as a Cloudflare Python Worker (cron trigger)"
requires-python = ">=3.12"
# Pyodide ships pydantic 2.10.x and ruamel.yaml, so keep these loose
dependencies = ["pydantic", "ruamel.yaml"]

[dependency-groups]
dev = ["workers-py", "workers-runtime-sdk"]
